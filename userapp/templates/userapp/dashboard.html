<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>Welcome {{username}}</h1></center>

    <hr>
    <h3>Categories</h3>
    {% for i in categories %}
    <p><b>{{i.name}}</b></p>
    {% endfor %}

    <hr>
    <h3>Restaurants</h3>
    {% for i in restaurants %}
    <img src="{{i.restaurantpic.url}}" height="200px" width="200px" alt=""> <br>
    <h3>{{i.name}}</h3>
    <h4>Address:{{i.address}}</h4>>

    {% endfor %}
</body>
</html>
